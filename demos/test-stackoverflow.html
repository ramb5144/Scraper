<!DOCTYPE html>
<html>
<head>
    <title>Stack Overflow Content Test</title>
</head>
<body>
    <h1>Testing Stack Overflow Content</h1>
    <div id="results"></div>

    <script>
        // Load the stackoverflow.html content via fetch to inspect it
        fetch('/stackoverflow-demo')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Count elements
                const divs = doc.querySelectorAll('div').length;
                const textLength = doc.body.textContent.trim().length;
                const visibleElements = doc.querySelectorAll('body *:not(script):not(style)').length;

                // Find text nodes
                function getTextNodes(element) {
                    const textNodes = [];
                    const walker = document.createTreeWalker(
                        element,
                        NodeFilter.SHOW_TEXT,
                        {
                            acceptNode: (node) => {
                                const text = node.textContent.trim();
                                if (text.length === 0) return NodeFilter.FILTER_REJECT;
                                return NodeFilter.FILTER_ACCEPT;
                            }
                        }
                    );
                    let node;
                    while (node = walker.nextNode()) {
                        textNodes.push(node);
                    }
                    return textNodes;
                }

                const textNodes = getTextNodes(doc.body);

                document.getElementById('results').innerHTML = `
                    <p>Total divs: ${divs}</p>
                    <p>Body text length: ${textLength} characters</p>
                    <p>Visible elements: ${visibleElements}</p>
                    <p>Text nodes found: ${textNodes.length}</p>
                    <p>First 5 text node samples:</p>
                    <ul>
                        ${textNodes.slice(0, 5).map((n, i) =>
                            `<li>Node ${i+1}: "${n.textContent.trim().substring(0, 100)}..."</li>`
                        ).join('')}
                    </ul>
                `;
            });
    </script>
</body>
</html>
